name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libwayland-dev libgtk-3-dev libasound2-dev libssl-dev pkg-config
      # ffmpeg is optional for people, but the tests of WebM, ProRes, video
      # and sound only run where it is installed.
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ffmpeg
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --workspace --all-targets --locked
      # Every test binary runs even after one fails, so a failure does not
      # hide the ones after it.
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast

  mac-app:
    name: Mac app (ad-hoc signed)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # No Apple account on CI: the same script as a release, with an ad-hoc
      # signature and no notarization.
      - name: Build Moshionly.app and the .dmg
        run: scripts/release-mac.sh --ad-hoc
      - name: Check the app
        run: |
          codesign --verify --strict --deep --verbose=2 dist/Moshionly.app
          signature="$(codesign -dvvv dist/Moshionly.app 2>&1)"
          case "$signature" in
            *flags=*runtime*) echo "Signed with the hardened runtime." ;;
            *) echo "The app is not signed with the hardened runtime."; exit 1 ;;
          esac
          plutil -lint dist/Moshionly.app/Contents/Info.plist
          dist/Moshionly.app/Contents/MacOS/moshionly --version
      - name: Check the installer
        run: |
          dmg="$(ls dist/Moshionly-*.dmg)"
          hdiutil verify "$dmg"
          mount="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          test -d "$mount/Moshionly.app"
          test "$(readlink "$mount/Applications")" = /Applications
          codesign --verify --strict --deep --verbose=2 "$mount/Moshionly.app"
          hdiutil detach "$mount"

  figma-plugin:
    name: Figma plugin tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        working-directory: plugins/figma
        run: node --test
