<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Moshionly</title>
<style>
  :root {
    --bg: var(--figma-color-bg, #ffffff);
    --bg-subtle: var(--figma-color-bg-secondary, #f5f5f5);
    --text: var(--figma-color-text, #1e1e1e);
    --text-muted: var(--figma-color-text-secondary, #6b6b6b);
    --border: var(--figma-color-border, #e6e6e6);
    --accent: var(--figma-color-bg-brand, #0d99ff);
    --accent-hover: var(--figma-color-bg-brand-hover, #007be5);
    --on-accent: var(--figma-color-text-onbrand, #ffffff);
    --danger: var(--figma-color-text-danger, #dc3412);
    --success: var(--figma-color-text-success, #14ae5c);
    --warning: var(--figma-color-text-warning, #b86200);
    --focus: var(--figma-color-border-selected, #0d99ff);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font: 11px/16px Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  section { padding: 12px 16px; border-bottom: 1px solid var(--border); }
  h1 { margin: 0 0 4px; font-size: 13px; line-height: 20px; font-weight: 600; }
  h2 { margin: 0 0 8px; font-size: 11px; font-weight: 600; }
  .muted { color: var(--text-muted); }
  .choice { display: flex; gap: 8px; align-items: flex-start; padding: 4px 0; cursor: pointer; }
  .choice input { margin: 2px 0 0; accent-color: var(--accent); }
  .choice span { display: block; }
  .actions { display: flex; gap: 8px; }
  button {
    font: inherit;
    font-weight: 500;
    height: 32px;
    padding: 0 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
  }
  button.primary { flex: 1; border-color: transparent; background: var(--accent); color: var(--on-accent); }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); }
  button:hover:not(:disabled) { background: var(--bg-subtle); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  button:disabled { opacity: 0.45; cursor: default; }
  .progress { height: 4px; margin-top: 12px; border-radius: 2px; background: var(--bg-subtle); overflow: hidden; }
  .progress > div { height: 100%; width: 0; background: var(--accent); transition: width 120ms linear; }
  .status { margin-top: 8px; min-height: 16px; }
  .status.error { color: var(--danger); }
  .status.ok { color: var(--success); }
  .notes { flex: 1; overflow-y: auto; border-bottom: none; }
  .notes ul { list-style: none; margin: 0; padding: 0; }
  .notes li { padding: 6px 0; border-top: 1px solid var(--border); }
  .notes li:first-child { border-top: none; }
  .notes .layer { font-weight: 500; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <section aria-live="polite">
    <h1>Send to Moshionly</h1>
    <div id="selection" class="muted">Select frames or layers to send.</div>
  </section>

  <section>
    <h2>When this design was sent before</h2>
    <label class="choice">
      <input type="radio" name="mode" value="new_artboards" checked>
      <span>Add it as new artboards</span>
    </label>
    <label class="choice">
      <input type="radio" name="mode" value="replace_matching">
      <span>Replace the matching layers and keep their animations<br><span class="muted">For a design you changed in Figma after animating it</span></span>
    </label>
  </section>

  <section>
    <div class="actions">
      <button id="send" class="primary" disabled>Send to Moshionly</button>
      <button id="copy" disabled>Copy</button>
    </div>
    <div class="progress" id="progress" hidden><div id="bar"></div></div>
    <div class="status" id="status" role="status"></div>
  </section>

  <section class="notes" id="notes" hidden>
    <h2 id="notes-title">Notes</h2>
    <ul id="notes-list"></ul>
  </section>

<script>
  'use strict';

  const view = {
    selection: document.getElementById('selection'),
    send: document.getElementById('send'),
    copy: document.getElementById('copy'),
    status: document.getElementById('status'),
  };

  function post(message) {
    parent.postMessage({ pluginMessage: message }, '*');
  }

  function describeSelection(summary) {
    if (!summary || summary.empty) return 'Select frames or layers to send.';
    const count = summary.count === 1 ? '1 layer' : summary.count + ' layers';
    const names = summary.names.join(', ') + (summary.more > 0 ? ' and ' + summary.more + ' more' : '');
    return count + ' selected: ' + names;
  }

  window.onmessage = (event) => {
    const message = event.data && event.data.pluginMessage;
    if (!message) return;
    if (message.type === 'selection') {
      view.selection.textContent = describeSelection(message.summary);
    }
  };

  post({ type: 'ready' });
</script>
</body>
</html>
