[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/steshio/moshionly"
authors = ["Moshionly contributors"]

[profile.dev]
# Keep our own code debuggable but make dependencies (renderer, image codecs) fast.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"
