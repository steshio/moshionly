[package]
name = "moshionly-app"
description = "Moshionly: open-source motion design for the desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "moshionly_app"
path = "src/lib.rs"

[[bin]]
name = "moshionly"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "clipboard",
    "links",
    "wayland",
    "wgpu",
    "x11",
] }
egui = "0.37"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu"] }
