[package]
name = "moshionly-app"
description = "Moshionly: open-source motion design for the desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "moshionly_app"
path = "src/lib.rs"

[[bin]]
name = "moshionly"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.92"
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "clipboard",
    "links",
    "persistence",
    "wayland",
    "wgpu",
    "x11",
] }
egui = "0.37"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
moshionly-agent = { version = "0.1.0", path = "../moshionly-agent" }
moshionly-ai = { version = "0.1.0", path = "../moshionly-ai" }
moshionly-core = { version = "0.1.0", path = "../moshionly-core" }
moshionly-export = { version = "0.1.0", path = "../moshionly-export" }
moshionly-render = { version = "0.1.0", path = "../moshionly-render" }
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1.54", features = ["rt-multi-thread", "sync", "time"] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu"] }
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "0.4"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "sync", "time"] }
