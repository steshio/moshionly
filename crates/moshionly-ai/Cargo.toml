[package]
name = "moshionly-ai"
description = "Chat providers for Moshionly: subscriptions through installed agent CLIs, and API keys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
async-trait = "0.1.92"
base64 = "0.23"
dirs = "7"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "system-proxy", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27"
thiserror = "2"
tokio = { version = "1.54", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = "0.7.20"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.32", features = ["signal"] }

[dev-dependencies]
axum = "0.8"
futures-util = "0.3"
tokio = { version = "1.54", features = ["macros", "net", "rt-multi-thread"] }
